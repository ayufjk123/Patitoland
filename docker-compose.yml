# PatitoLand production stack
#
# Architecture:
#   Internet ─► Cloudflare (TLS termination)
#            ─► cloudflared tunnel (outbound only, no router ports)
#            ─► caddy:80  (static SPA + reverse proxy)
#               ├ /api/* → backend:8080  (Spring Boot)
#               └ /*     → /srv          (Angular dist)
#                          ↓
#                       postgres:5432   (persistent volume ./data/postgres)
#
# No service publishes to the host; cloudflared connects via the internal bridge network.

services:
  postgres:
    image: postgres:16-alpine
    container_name: patitoland-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: patitoland
      POSTGRES_USER: patitoland
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Speed up first start; disable if you need stricter durability
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # Bind only to the host loopback so local GUI tools (DBeaver, psql) can
    # connect at localhost:5432. NOT exposed to the LAN or the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patitoland -d patitoland"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patitoland-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/patitoland
      DATABASE_USER: patitoland
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_TO: ${MAIL_TO}
      MAIL_FROM: ${MAIL_FROM}
      GOOGLE_CALENDAR_SALA_PRIVADA: ${GOOGLE_CALENDAR_SALA_PRIVADA}
      GOOGLE_CALENDAR_ZONA_RESTAURACION: ${GOOGLE_CALENDAR_ZONA_RESTAURACION}
      GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON}
      GOOGLE_IMPERSONATE_EMAIL: ${GOOGLE_IMPERSONATE_EMAIL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COUPON_ADMIN_TOKEN: ${COUPON_ADMIN_TOKEN}
      JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+UseG1GC"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: patitoland-caddy
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist/patitoland-app/browser:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: patitoland-cloudflared
    restart: unless-stopped
    depends_on:
      - caddy
      - backend
    # Token-based tunnel: easiest setup, all config managed in CF dashboard.
    # The token is generated by `cloudflared tunnel token <name>` after first login.
    # TCP/HTTP2 is more reliable on this connection than QUIC/UDP, which has
    # repeatedly timed out and dropped all tunnel connections.
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set in .env}
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
